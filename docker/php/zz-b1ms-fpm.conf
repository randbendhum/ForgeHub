[www]
; Tuned for 1 GB - 2 GB RAM cloud instances (Oracle E2.1.Micro / Azure B1ms)
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 65s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
