# ==============================================================================
# Production Docker Compose — Tuned for Oracle E2.1.Micro (1 GB RAM) & Azure B1ms
# Includes Caddy 2 with automatic Let's Encrypt HTTPS for forgehub.humbertorandon.com
# ==============================================================================
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: forgemod-app-prod
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
      RUN_DEMO_SEEDER: "true"
    volumes:
      - mods-storage:/var/www/html/storage/app/mods
      - public-build:/var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M

  caddy:
    image: caddy:2.8-alpine
    container_name: forgemod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-forgehub.humbertorandon.com}
    volumes:
      - ./public:/var/www/html/public:ro
      - public-build:/var/www/html/public/build:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 96M

  mysql:
    image: mysql:8.4
    container_name: forgemod-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-forgemod}
      MYSQL_USER: ${DB_USERNAME:-forge}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my-b1ms.cnf:/etc/mysql/conf.d/my-b1ms.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql-data:
  mods-storage:
  public-build:
  caddy-data:
  caddy-config:
